name: 앱 빌드

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 깃허브 빌드 서버에는 안드로이드 SDK가 이미 설치돼 있음 (ANDROID_HOME)
      - name: 안드로이드 SDK 확인
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls $ANDROID_HOME/platforms | tail -3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK 만들기
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: 파일 이름 정리
        run: cp app/build/outputs/apk/debug/app-debug.apk screen-translator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: screen-translator
          path: screen-translator.apk

      # 폰 브라우저에서 바로 받을 수 있게 Releases에 올림 (로그인 없이 다운로드 가능)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 화면 번역 ${{ github.run_number }}
          body: 이 페이지 아래 Assets의 screen-translator.apk 를 폰에서 눌러 설치하세요.
          files: screen-translator.apk
          make_latest: true
